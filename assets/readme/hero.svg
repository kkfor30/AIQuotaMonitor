<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AIQuotaMonitor · 多平台 AI 额度，一处看清</title>
  <desc id="desc">Codex 本机 Plus 账号额度卡：5 小时剩余 66%，7 天剩余 95%，并显示各窗口重置时间。数值取自用户 2026-09-12 总览截图，不是实时额度。</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#e3f3f3"/></linearGradient>
    <linearGradient id="orb" x2="1" y2="1"><stop stop-color="#0a66ff"/><stop offset="1" stop-color="#00a67d"/></linearGradient>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#canvas)"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="64" y="76" fill="#42617e" font-size="20" letter-spacing="3">WINDOWS · AI QUOTA MONITOR</text>
    <text x="60" y="163" fill="#142d49" font-size="70" font-weight="700" letter-spacing="-3">AIQuotaMonitor</text>
    <text x="64" y="231" fill="#142d49" font-size="40" font-weight="600">多平台 AI 额度，一处看清。</text>
    <text x="64" y="284" fill="#48627d" font-size="25">订阅窗口 / API 余额 / GPT 重置雷达</text>
    <path d="M64 339H681" stroke="#c5d7e7"/>
    <text x="64" y="384" fill="#345572" font-size="22">桌面总览</text>
    <circle cx="191" cy="376" r="3" fill="#8aabc3"/>
    <text x="213" y="384" fill="#345572" font-size="22">屏幕边缘速览</text>
    <circle cx="386" cy="376" r="3" fill="#8aabc3"/>
    <text x="408" y="384" fill="#345572" font-size="22">多账号独立刷新</text>
  </g>
  <!-- Values transcribed from the user-provided overview screenshot, 2026-09-12. -->
  <g id="quota-example" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="763" y="40" width="397" height="360" rx="24" fill="#f8fcff" stroke="#ccdeec"/>
    <text x="789" y="84" fill="#142d49" font-size="28" font-weight="700">Codex</text>
    <rect x="997" y="57" width="137" height="36" rx="18" fill="#e4edff"/>
    <text x="1065" y="82" text-anchor="middle" fill="#0a66ff" font-size="20">本机 · Plus</text>
    <text x="789" y="121" fill="#48627d" font-size="18">剩余额度 · 09-12 截图示例</text>
    <path d="M789 141H1134" stroke="#dce7ef"/>
    <text x="789" y="178" fill="#142d49" font-size="22">5 小时窗口</text>
    <text x="1134" y="178" text-anchor="end" fill="#0a66ff" font-size="25" font-weight="700">剩余 66%</text>
    <rect x="789" y="194" width="345" height="10" rx="5" fill="#e1eaf1"/>
    <rect x="789" y="194" width="228" height="10" rx="5" fill="#0a66ff"/>
    <text x="789" y="235" fill="#48627d" font-size="20">重置于 09-13 00:24</text>
    <text x="789" y="281" fill="#142d49" font-size="22">7 天窗口</text>
    <text x="1134" y="281" text-anchor="end" fill="#008765" font-size="25" font-weight="700">剩余 95%</text>
    <rect x="789" y="297" width="345" height="10" rx="5" fill="#e1eaf1"/>
    <rect x="789" y="297" width="328" height="10" rx="5" fill="#00a67d"/>
    <text x="789" y="338" fill="#48627d" font-size="20">重置于 09-19 19:24</text>
    <text x="789" y="376" fill="#48627d" font-size="18">每个账号，独立查看与刷新</text>
  </g>
</svg>
